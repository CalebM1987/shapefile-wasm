version: 2

updates:
  # Actions pinned to a SHA do not update themselves, and a pinned-but-stale
  # action is its own risk. Dependabot rewrites the SHA and the trailing version
  # comment together, so pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # One PR for the build and test tooling; these move together and none of
      # it ships to consumers.
      dev-tooling:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
