name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel a run mid-deploy — that can leave the
# Pages site in a half-updated state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # VitePress reads git history to show a last-updated timestamp.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Needed by `pnpm run build` below: the demo imports the built package,
      # and building it compiles the Rust core to wasm.
      - name: Install wasm-pack
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: wasm-pack

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # One install at the workspace root covers the demo too — it links the
      # library with `workspace:*`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The demo imports the built package, so this has to happen first.
      - name: Build the package
        run: pnpm run build

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # A project site is served from /<repo>/, so every asset URL needs that
      # prefix or the CSS 404s. `base_path` comes from the Pages config, so a
      # rename or a move to a custom domain does not silently break the site.
      # VitePress requires a trailing slash; base_path has none, and is empty
      # for a user or org site, where the base is just "/".
      - name: Resolve the site base path
        id: base
        run: echo "value=${BASE_PATH:-}/" >> "$GITHUB_OUTPUT"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Runs typedoc, vitepress build, cargo doc and the demo build, staging the
      # last two into dist/ afterwards. DOCS_BASE reaches the demo too, so its
      # assets resolve under <base>/app/.
      - name: Build documentation and demo
        run: pnpm run docs:build
        env:
          DOCS_BASE: ${{ steps.base.outputs.value }}

      # Both are copied in after vitepress build, so a silent failure there
      # would otherwise ship a site with two dead sections.
      - name: Check the demo and Rust docs were staged
        run: |
          test -f docs/.vitepress/dist/app/index.html
          test -f docs/.vitepress/dist/rustdoc/shapefile_wasm/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
