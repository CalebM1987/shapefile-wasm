name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege. `id-token: write` is what lets npm verify, via OIDC, that this
# workflow in this repository produced the tarball — it is what makes Trusted
# Publishing and provenance work. No long-lived npm token is involved.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # A named environment lets you require a manual approval before anything
    # reaches npm. Configure reviewers under Settings -> Environments.
    environment: npm-publish

    steps:
      # Every action is pinned to a commit SHA. A tag like `v4` is a moving
      # pointer the action's owner can repoint at any time, so a compromised
      # upstream would run inside a job that has an OIDC token.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: wasm-pack

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm. The version bundled with Node is
      # often older than the one that supports it.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level low

      - name: Test
        run: |
          cargo test
          pnpm run build
          pnpm run test:ts

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. With Trusted Publishing configured on npmjs.com for
      # this repository and workflow, npm mints a short-lived credential from the
      # OIDC token above. There is no long-lived secret to steal or phish, which
      # is how most recent npm supply-chain compromises started.
      - name: Publish
        run: npm publish --access public --provenance
