name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never race two release PRs against each other.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      pr_branch: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
    steps:
      # Reads Conventional Commits since the last tag, then either opens/updates
      # a release PR (bumping package.json, Cargo.toml and CHANGELOG.md) or, when
      # that PR is merged, tags and publishes a GitHub Release.
      #
      # That Release is what triggers publish.yml, so npm is only ever reached
      # through a change you reviewed and merged.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please updates Cargo.toml but knows nothing about Cargo.lock, which
  # carries this crate's version too. Refresh it on the release branch so the
  # merged commit is internally consistent.
  sync-cargo-lock:
    name: Sync Cargo.lock
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Refresh the lockfile
        run: cargo update --workspace --offline || cargo update --workspace

      - name: Commit if it changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches Cargo.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock with the released version"
          git push
